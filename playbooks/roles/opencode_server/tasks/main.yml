---
# OpenCode as a loopback-only server in the VM, configured for Anthropic plus (when
# local_llm_models is filled) the oMLX endpoint. The Hermes bridge calls it from inside
# the VM (opencode run --server http://127.0.0.1:4096); it is deliberately NOT exposed
# to the LAN — only Hermes' dashboard crosses that boundary, behind basic auth.

- name: Fetch the OpenCode installer script (VM)
  ansible.builtin.get_url:
    url: "{{ opencode_install_url }}"
    dest: "{{ agents_vm_root }}/tmp/opencode-install.sh"

# The official installer lands the binary in ~/.opencode/bin (HOME is pinned to the
# VM user) and appends a PATH line to its shell rc.
- name: Install OpenCode if not present (VM)
  ansible.builtin.shell: bash {{ agents_vm_root }}/tmp/opencode-install.sh
  args:
    creates: "{{ agents_vm_home }}/.opencode/bin/opencode"
  environment:
    HOME: "{{ agents_vm_home }}"

# The keys are written straight into opencode.json (0600), so every OpenCode process
# finds them: the server unit, and `opencode` run by hand over SSH, which never sees a
# systemd EnvironmentFile. An earlier layout kept them in a separate env file instead.
- name: Ensure OpenCode's config dir exists (VM)
  ansible.builtin.file:
    path: "{{ agents_vm_home }}/.config/opencode"
    state: directory

- name: Write the OpenCode config (providers with keys, default model, loopback server)
  ansible.builtin.template:
    src: opencode.json.j2
    dest: "{{ agents_vm_home }}/.config/opencode/opencode.json"
    mode: "0600"

- name: Remove the old OpenCode env file (keys now live in opencode.json)
  ansible.builtin.file:
    path: "{{ agents_vm_home }}/.config/opencode/env"
    state: absent

# --- system service (root; shared unit lifecycle in the systemd_unit role) --------------
- name: Install and manage the opencode-server unit (loopback only — never LAN)
  ansible.builtin.include_role:
    name: systemd_unit
  vars:
    unit_name: opencode-server
    # Rendered from THIS role's templates dir (lookups resolve against the including
    # role); systemd_unit writes it with copy.
    unit_content: "{{ lookup('template', 'opencode-server.service.j2') }}"

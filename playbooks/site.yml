---
# M3: provision the app inventory. Re-running is the update path.
# Per ADR-0001, an app already present on this machine is never installed.
# Manual installs are left entirely alone (no install, no upgrade); apps brew
# manages — including ones installed this run — are kept current by the scoped
# upgrade.
- name: Provision managed apps
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # ---- your app list -------------------------------------------------
    # Casks are presence-checked at apps_dir/<app_name>.app, except command-line
    # casks with a bin: entry, which are checked as `command -v <bin>`. Formulas
    # use the same PATH check (defaults to the formula name). Anything present is
    # never installed; only manual installs are also excluded from upgrades.
    casks:
      - name: 1password            # bootstrap dep — usually already present manually (ADR-0001)
        app_name: 1Password
      - name: iterm2               # .app is iTerm.app, not iterm2.app
        app_name: iTerm
      - name: visual-studio-code   # .app is "Visual Studio Code.app"
        app_name: Visual Studio Code
      - name: claude-code          # CLI cask: no /Applications bundle to check for
        bin: claude
      - name: codex                # CLI cask: no /Applications bundle to check for
        bin: codex
      - name: orbstack             # .app is OrbStack.app; hosts the agents VM (playbooks/agents-vm.yml)
        app_name: OrbStack

    formulas:
      - name: opencode             # the AI coding agent this repo is built with
      - name: emacs                # I am still an emacs person
      - name: gh
      - name: uv
      - name: node                 # runs the Matt Pocock skills installer (npx) below
      - name: shellcheck           # `make check` lints this repo's shell with it

    apps_dir: "{{ lookup('env', 'APPS_DIR') | default('/Applications', true) }}"  # cask presence-check dir

    # Oh My Zsh is not in Homebrew: it installs with its own script into a git
    # checkout. Present = that directory exists. Honors $ZSH like the installer
    # does, else ~/.oh-my-zsh. It keeps itself current (built-in auto-update),
    # so it stays out of the scoped brew upgrade. The installer is fetched with
    # get_url (not `curl` in a shell) so a failed download fails the run instead
    # of sh-ing an empty script. URL is overridable for tests (file://...).
    oh_my_zsh_dir: "{{ lookup('env', 'ZSH') | default(lookup('env', 'HOME') ~ '/.oh-my-zsh', true) }}"
    oh_my_zsh_install_url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    oh_my_zsh_installer: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/oh-my-zsh-install.sh"

    # Matt Pocock's agent skills: installed and kept current by the shared matt_skills
    # role (the agents VM installs the same set for OpenCode, see playbooks/agents-vm.yml).
    # One shared set at ~/.agents/skills for Codex/OpenCode, symlinked into Claude Code's
    # ~/.claude/skills; OpenCode is deliberately not an --agent target (it already reads
    # global ~/.agents/skills). Presence is that marker pair; a managed install also has
    # the lock re-runs use for `skills update` change detection. @latest is deliberate:
    # this inventory tracks the newest release, not a pinned one.

  tasks:
    - name: Detect app-bundle casks already present (including manual installs)
      ansible.builtin.stat:
        path: "{{ apps_dir }}/{{ item.app_name | default(item.name) }}.app"
      loop: "{{ casks | rejectattr('bin', 'defined') }}"
      register: app_cask_presence

    - name: Detect command-line casks already present (including manual installs)
      ansible.builtin.shell: command -v {{ item.bin | quote }}
      loop: "{{ casks | selectattr('bin', 'defined') }}"
      failed_when: false
      changed_when: false
      register: bin_cask_presence

    - name: Detect formulas already present (including manual installs)
      ansible.builtin.shell: command -v {{ item.bin | default(item.name) | quote }}
      loop: "{{ formulas }}"
      failed_when: false
      changed_when: false
      register: formula_presence

    - name: Detect casks managed by Homebrew (manual installs are invisible to brew)
      ansible.builtin.shell: brew list --cask {{ item.name }}
      loop: "{{ casks }}"
      failed_when: false
      changed_when: false
      register: cask_managed

    - name: Detect formulas managed by Homebrew (manual installs are invisible to brew)
      ansible.builtin.shell: brew list --formula {{ item.name }}
      loop: "{{ formulas }}"
      failed_when: false
      changed_when: false
      register: formula_managed

    - name: Record the presence and management sets (ADR-0001)
      ansible.builtin.set_fact:
        present_casks: >-
          {{ (app_cask_presence.results | selectattr('stat.exists') | map(attribute='item.name') | list)
             + (bin_cask_presence.results | selectattr('stdout', 'ne', '') | map(attribute='item.name') | list) }}
        present_formulas: "{{ formula_presence.results | selectattr('stdout', 'ne', '') | map(attribute='item.name') | list }}"
        managed_casks: "{{ cask_managed.results | selectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}"
        managed_formulas: "{{ formula_managed.results | selectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}"

    - name: Record the manually-present set (never touched — ADR-0001)
      ansible.builtin.set_fact:
        manual_casks: "{{ present_casks | difference(managed_casks) }}"
        manual_formulas: "{{ present_formulas | difference(managed_formulas) }}"

    - name: Install casks that are not present (brew-managed idempotency is the module's job)
      community.general.homebrew_cask:
        name: "{{ item }}"
        path: "{{ homebrew_path | default(omit) }}"
      loop: "{{ casks | rejectattr('name', 'in', present_casks) | map(attribute='name') | list }}"

    - name: Install formulas that are not present (brew-managed idempotency is the module's job)
      community.general.homebrew:
        name: "{{ item }}"
        path: "{{ homebrew_path | default(omit) }}"
      loop: "{{ formulas | rejectattr('name', 'in', present_formulas) | map(attribute='name') | list }}"

    # rejectattr keeps inventory order; the set-based `difference` filter would
    # scramble it (Python hash randomization), making runs non-deterministic. The
    # managed set is recorded once and reused below (manual installs stay out — ADR-0001).
    # By this point every entry is brew-managed: pre-existing managed apps plus the
    # ones installed by this run, so `brew outdated`/`upgrade` never see unknown names.
    - name: Record the brew-managed set in inventory order (the upgradeable set)
      ansible.builtin.set_fact:
        upgrade_casks: "{{ casks | rejectattr('name', 'in', manual_casks) | map(attribute='name') | list }}"
        upgrade_formulas: "{{ formulas | rejectattr('name', 'in', manual_formulas) | map(attribute='name') | list }}"

    # Ask brew itself what is outdated, scoped to the managed set (casks and formulas
    # are separate namespaces). Parsing `brew upgrade` output is fragile; this is brew's
    # own signal, and it lets an up-to-date run report changed=0.
    - name: Check for outdated managed formulas
      ansible.builtin.shell: brew outdated --formula {{ upgrade_formulas | join(' ') }}
      failed_when: false
      changed_when: false
      register: outdated_formulas
      when: upgrade_formulas | length > 0

    - name: Check for outdated managed casks
      ansible.builtin.shell: brew outdated --cask {{ upgrade_casks | join(' ') }}
      failed_when: false
      changed_when: false
      register: outdated_casks
      when: upgrade_casks | length > 0

    - name: Scoped upgrade of the brew-managed set (manual installs stay out — ADR-0001)
      ansible.builtin.command: "brew upgrade {{ (upgrade_casks + upgrade_formulas) | join(' ') }}"
      when: >-
        (outdated_formulas.stdout | default('') | trim) != '' or
        (outdated_casks.stdout | default('') | trim) != ''
      changed_when: true  # only runs when the outdated checks above found something to do

    - name: Check whether Oh My Zsh is present (ADR-0001)
      ansible.builtin.stat: path="{{ oh_my_zsh_dir }}"
      register: omz_present

    - name: Fetch the Oh My Zsh installer (only when missing)
      ansible.builtin.get_url:
        url: "{{ oh_my_zsh_install_url }}"
        dest: "{{ oh_my_zsh_installer }}"
      when: not omz_present.stat.exists

    # --unattended: no chsh (macOS already defaults to zsh), no interactive zsh.
    # --keep-zshrc: never replace an existing ~/.zshrc; a fresh Mac has none, so
    # it gets the Oh My Zsh template. `creates` is a second presence gate (ADR-0001).
    - name: Install Oh My Zsh if not present
      ansible.builtin.shell: sh {{ oh_my_zsh_installer | quote }} --unattended --keep-zshrc
      args:
        creates: "{{ oh_my_zsh_dir }}"
      environment:
        ZSH: "{{ oh_my_zsh_dir }}"

    # A partial install is repaired by running the installer; a manual full install
    # (both markers, no lock) is left entirely alone — ADR-0001.
    - name: Install and update the Matt Pocock skills (shared role)
      ansible.builtin.include_role:
        name: matt_skills
      vars:
        skills_home: "{{ lookup('env', 'HOME') }}"
        matt_skills_agents: [codex, claude-code]

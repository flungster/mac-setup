---
# Template for playbooks/secrets/agents-vm-secrets.yml — the agents VM's secrets,
# kept in an Ansible Vault file. Copy it to that name, fill in your values, then
# encrypt:
#   cp playbooks/secrets/agents-vm-secrets.example.yml \
#      playbooks/secrets/agents-vm-secrets.yml
#   ansible-vault encrypt --vault-password-file <file> \
#      playbooks/secrets/agents-vm-secrets.yml
# Keep both the secrets file and its password out of git (the real filename is in
# .gitignore). Run the playbook with --vault-password-file <file> (bootstrap.sh's
# AGENTS_VAULT_PASSWORD_FILE does this for you).
#
# Required: anthropic_api_key, hermes_dashboard_password. Every other key is
# optional — each enables its feature only when filled in:

anthropic_api_key: "sk-ant-"      # Anthropic Console; main model for both agents

hermes_dashboard_password: ""     # the dashboard login (username is a playbook var, default "admin")

telegram_bot_token: ""            # from @BotFather; enables the Telegram gateway
telegram_allowed_users: ""        # your numeric user ID (from @userinfobot); only you can drive the bot

google_oauth_client_id: ""        # Desktop (external) client from your Google Cloud project
google_oauth_client_secret: ""    # same client; enables read-only Gmail + Calendar via workspace-mcp

github_token: ""                  # fine-grained PAT, Contents read/write on flungster/mac-setup
                                  # and flungster/health-tracker; enables git clones + gh for the agents

local_llm_api_key: ""             # only if your oMLX server (local_llm_base_url) requires a key
